check_rules: |
  C1 Quote fidelity: every quoted passage in an answer ("...", „...", "...") of 4 or
     more words must be a verbatim substring (case- and whitespace-normalised) of at
     least one evidence_de or evidence_en string across the thread's stored
     assessments (all listings assessed so far in that thread, not only the
     question's own listing - a follow-up may legitimately quote evidence from an
     earlier turn). A passage stitched together from two separate evidence entries
     fails, because the combined string will not appear verbatim in either one.
  C2 Match/gap consistency: for the listing a turn is about (all three listings, for
     turn b), split the answer into sentences; a sentence naming a skill from that
     listing's stored `matches` together with a gap marker, or naming a skill from
     `gaps` together with a match marker, is flagged. Gap markers are evaluated
     first and stripped out of the sentence before it is searched for match
     markers, so a gap phrase that contains a match-marker word as a substring
     (e.g. "not met" contains "met"; "not in your profile" contains "your
     profile") is never also read as a match marker. Heuristic (sentence-level
     co-occurrence, not real semantic parsing) - every flag is read by a person and
     reported as confirmed or a false alarm, with the sentence quoted.
  C3 Category consistency: a category word (strong, partial, poor, excluded) stated
     in a sentence that also names the listing (by referenznummer, title or
     employer) must equal that listing's stored category.
  C4 No new tool call for turns a-c (FR-08 AC1): the turn's own tool calls must be
     empty - these are answered from the stored assessment, not by calling
     assess_fit (or any other tool) again.
  C5 Turn d (a listing not assessed in this thread): passes if either assess_fit was
     called for that referenznummer in this turn, or the answer states that the
     listing has not been assessed; fails if the answer states a category word for
     it without a matching assess_fit call in this turn. Only the "states a category
     word" shape of invariant-2 violation is checked by this rule - a vaguer answer
     that neither declines nor states a category is not separately scored, which is
     recorded as a limitation (not every way of overstepping invariant 2 in prose is
     caught).

marker_lists:
  # Fixed in advance (WP-15c HALT 1) - not tuned against any run's answers.
  match_markers:
    - match
    - matches
    - matched
    - met
    - meets
    - satisfies
    - satisfied
    - covers
    - covered
    - present
    - "you have"
    - "you already have"
    - "your profile"
    - "in your profile"
    - "you know"
  gap_markers:
    - gap
    - gaps
    - missing
    - miss
    - lack
    - lacks
    - lacking
    - absent
    - "not met"
    - "doesn't mention"
    - "does not mention"
    - "not mentioned"
    - "not require"
    - "doesn't require"
    - "does not require"
    - "not in your profile"
    - "don't have"
    - "do not have"
    - "no experience"
    - "you would need"

