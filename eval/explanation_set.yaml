# Explanation-consistency question set (D-13 Option 2, spec FR-08, WP-15c).
#
# One question set, no dev/test split (no tuning happens against it - CLAUDE.md
# invariant 6 only requires that separation for scenarios used to tune behaviour;
# this set only measures). 3 threads, each assessing 3 named listings up front and
# then asking 4 neutral follow-up questions about them (no false premises: none of
# the questions assert a category, a skill match or an exclusion reason in advance -
# the model's answer is checked against whatever the app itself computed).
#
# Related: D-13, FR-08 AC1, FR-08 AC2, spec §6.3, §9, invariants 2, 4, 5, 6, D-28

