seed: 1300
rule: Stratify the 62 real fixture listings (FIKTIV-* crafted demo listings excluded) into temp_agency
  (is_temp_agency is True), skill_match (Python or Java as a whole word in title+description, and not
  temp_agency), no_skill_match (neither). Allocate a fixed 3/9/8 of the 20 to temp_agency/skill_match/no_skill_match
  (1/3/4 dev, 2/6/4 test) - not proportional to pool size, so the code-only temp_agency exclusion does
  not dominate the set (Ingo, 2026-11-16). Within each stratum, shuffle with a single random.Random(1300)
  continued across strata and take dev first, then test, from that shuffled order, skipping (and so redrawing
  further down that stratum's order) any listing that would put its employer over a cap of 2 across the
  whole set (Ingo, 2026-11-16). No app run, no model call, no rubric computation.
approval:
  date: '2026-11-16'
  by: Ingo
  note: First draft used proportional allocation (7/6/7) and no employer cap - NTT DATA Deutschland SE
    alone would have contributed 4 of 20. Approved with the fixed 3/9/8 allocation and the employer cap
    above; seed and shuffle-then-take procedure unchanged.
