rule: >-
  WP-14b (D-26, step 1). The 20 listings of eval/fit_set.yaml are now all development
  listings. Draw 10 new test listings from the real fixture listings (FIKTIV-* crafted demo
  listings excluded) that are not already in eval/fit_set.yaml, using the same strata
  definitions as fit_set.yaml - temp_agency (is_temp_agency is True), skill_match (Python
  or Java as a whole word in title+description, and not temp_agency), no_skill_match
  (neither) - with a fixed allocation of 1 temp_agency / 6 skill_match / 3 no_skill_match
  (not proportional to pool size, for the same reason as fit_set.yaml's allocation - the
  code-only temp_agency exclusion must not dominate the set). Within each stratum (file
  order), shuffle with a single random.Random(1400) continued across strata (temp_agency,
  then skill_match, then no_skill_match) and take from the shuffled order, skipping (and so
  redrawing further down that stratum's order) any listing that would put its employer over
  a cap of 2 across the whole set of 30 (the original 20 + these 10, exact employer-string
  match, same rule as fit_set.yaml). No app run, no model call, no rubric computation.
